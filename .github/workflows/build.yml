name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MINIMUM_SWIFT_VERSION: "6.4"
  XCODE_VERSION: "27.0"

jobs:
  pr-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SwiftUICalendar
    steps:
      - name: Checkout SwiftUICalendar
        uses: actions/checkout@v7.0.1
        with:
          path: SwiftUICalendar

      - name: Select Swift toolchain
        run: bash ./scripts/select-swift-toolchain.sh

      - name: Record toolchain fingerprint
        id: toolchain-fingerprint
        run: echo "value=$(swift --version | tr '\n' ' ')|$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies and build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            SwiftUICalendar/.build
            SwiftUICalendar/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('SwiftUICalendar/Package.swift', 'SwiftUICalendar/Package.resolved', 'SwiftUICalendar/Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ steps.toolchain-fingerprint.outputs.value }}

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Validate Swift formatting
        run: bash ./scripts/lint.sh

      - name: Validate test watchdog
        run: ruby ./scripts/tests/test-watchdog-test.rb

      - name: Build package
        run: swift build -c debug

      # Runs every package test, in parallel, with coverage enabled, then enforces the minimum.
      - name: Run all tests and check coverage
        timeout-minutes: 20
        env:
          MINIMUM_COVERAGE: 80
        run: ruby ./scripts/test-watchdog.rb --timeout 900 -- bash ./scripts/check-coverage.sh

      - name: Upload package test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: package-test-diagnostics
          path: SwiftUICalendar/.build/test-diagnostics
          if-no-files-found: ignore

      - name: Build iOS sample
        # Allow the locked TCA dependency macros on fresh, noninteractive CI runners.
        run: >-
          xcodebuild -project Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj
          -scheme SwiftUICalendarSample -destination "generic/platform=iOS Simulator"
          -skipMacroValidation
          -derivedDataPath .build/SampleRelease CODE_SIGNING_ALLOWED=NO build

      - name: Compile public API examples
        run: bash ./scripts/check-examples.sh

      - name: Build DocC documentation
        run: bash ./scripts/build-docs.sh

  # Builds the sample once, then runs every UI test plan from that build. Parallelism and ordering
  # come from the plans themselves; Xcode clones the simulators it needs.
  ui-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SwiftUICalendar
    env:
      PROJECT: Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj
      DEVICE_NAME: iPhone 17
      # A cold simulator clone can take minutes to launch an app in landscape, and an app that is
      # starved that long answers no accessibility query (build 37137076097 spent 10 minutes in one
      # test). Run serially so clones do not starve each other, fail a stuck test in minutes rather
      # than the default, and retry once in a fresh process before calling it a regression.
      # Simulator diagnostics collection never finishes on this runner: it waits out its 600-second
      # timeout after any failure (run 38346060741) and adds nothing to the result bundle.
      UI_TEST_FLAGS: >-
        -parallel-testing-enabled NO -test-timeouts-enabled YES
        -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300
        -retry-tests-on-failure -test-iterations 2 -test-repetition-relaunch-enabled YES
        -collect-test-diagnostics never
    steps:
      - name: Checkout SwiftUICalendar
        uses: actions/checkout@v7.0.1
        with:
          path: SwiftUICalendar

      - name: Select Swift toolchain
        run: bash ./scripts/select-swift-toolchain.sh

      - name: Build sample UI tests once
        # Allow the locked TCA dependency macros on fresh, noninteractive CI runners.
        run: >-
          xcodebuild build-for-testing -project "$PROJECT" -scheme SwiftUICalendarSample
          -destination "platform=iOS Simulator,name=$DEVICE_NAME" -skipMacroValidation
          -testProductsPath .build/SampleUITests.xctestproducts

      # Left to xcodebuild, a cold boot overlaps the test runner's launch, and the runner can stay
      # suspended until the plan fails (run 38346060741). Boot after the build, not during it: on
      # this 3-CPU runner a concurrent first boot slowed the build from 3 to 16 minutes (run
      # 38404918337).
      - name: Boot UI test simulator
        timeout-minutes: 15
        run: |
          udid="$(bash ./scripts/ui-test-simulator.sh boot "$DEVICE_NAME")"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          bash ./scripts/ui-test-simulator.sh wait "$udid"

      - name: Run default UI test plan
        timeout-minutes: 60
        run: |
          mkdir -p .build/results
          bash ./scripts/ui-test-simulator.sh test "$SIMULATOR_UDID" SwiftUICalendarSample \
            .build/results/default.xcresult $UI_TEST_FLAGS

      - name: Run per-language UI test plan
        timeout-minutes: 40
        run: >-
          bash ./scripts/ui-test-simulator.sh test "$SIMULATOR_UDID" SwiftUICalendarSampleLocales
          .build/results/locales.xcresult $UI_TEST_FLAGS

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-test-results
          path: SwiftUICalendar/.build/results
          if-no-files-found: ignore

  main-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SwiftUICalendar
    steps:
      - name: Checkout SwiftUICalendar
        uses: actions/checkout@v7.0.1
        with:
          path: SwiftUICalendar

      - name: Select Swift toolchain
        run: bash ./scripts/select-swift-toolchain.sh

      - name: Record toolchain fingerprint
        id: toolchain-fingerprint
        run: echo "value=$(swift --version | tr '\n' ' ')|$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies and build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            SwiftUICalendar/.build
            SwiftUICalendar/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('SwiftUICalendar/Package.swift', 'SwiftUICalendar/Package.resolved', 'SwiftUICalendar/Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ steps.toolchain-fingerprint.outputs.value }}

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Validate Swift formatting
        run: bash ./scripts/lint.sh

      - name: Validate test watchdog
        run: ruby ./scripts/tests/test-watchdog-test.rb

      - name: Build package
        run: swift build -c debug

      # Runs every package test, in parallel, with coverage enabled, then enforces the minimum.
      - name: Run all tests and check coverage
        timeout-minutes: 20
        env:
          MINIMUM_COVERAGE: 80
        run: ruby ./scripts/test-watchdog.rb --timeout 900 -- bash ./scripts/check-coverage.sh

      - name: Upload package test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: package-test-diagnostics
          path: SwiftUICalendar/.build/test-diagnostics
          if-no-files-found: ignore

      - name: Build iOS sample
        # Allow the locked TCA dependency macros on fresh, noninteractive CI runners.
        run: >-
          xcodebuild -project Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj
          -scheme SwiftUICalendarSample -destination "generic/platform=iOS Simulator"
          -skipMacroValidation
          -derivedDataPath .build/SampleRelease CODE_SIGNING_ALLOWED=NO build

      - name: Compile public API examples
        run: bash ./scripts/check-examples.sh

      - name: Build DocC documentation
        run: bash ./scripts/build-docs.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: SwiftUICalendar/.build/docs

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: main-validation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
