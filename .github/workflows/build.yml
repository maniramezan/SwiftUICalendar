name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MINIMUM_SWIFT_VERSION: "6.4"
  XCODE_VERSION: "27.0"

jobs:
  pr-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SwiftUICalendar
    steps:
      - name: Checkout SwiftUICalendar
        uses: actions/checkout@v7.0.1
        with:
          path: SwiftUICalendar

      - name: Select Swift toolchain
        run: bash ./scripts/select-swift-toolchain.sh

      - name: Record toolchain fingerprint
        id: toolchain-fingerprint
        run: echo "value=$(swift --version | tr '\n' ' ')|$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies and build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            SwiftUICalendar/.build
            SwiftUICalendar/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('SwiftUICalendar/Package.swift', 'SwiftUICalendar/Package.resolved', 'SwiftUICalendar/Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ steps.toolchain-fingerprint.outputs.value }}

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Validate Swift formatting
        run: bash ./scripts/lint.sh

      - name: Validate CI scripts
        run: |
          ruby ./scripts/tests/test-watchdog-test.rb
          ruby ./scripts/tests/ui-test-simulator-test.rb
          ruby ./scripts/tests/ui-test-workflow-test.rb

      - name: Build package
        run: swift build -c debug

      # Runs every package test, in parallel, with coverage enabled, then enforces the minimum.
      - name: Run all tests and check coverage
        timeout-minutes: 20
        env:
          MINIMUM_COVERAGE: 80
        run: ruby ./scripts/test-watchdog.rb --timeout 900 -- bash ./scripts/check-coverage.sh

      - name: Upload package test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-test-diagnostics
          path: SwiftUICalendar/.build/test-diagnostics
          if-no-files-found: ignore

      # The ui-test-build job compiles the iOS sample with build-for-testing; do not build it again here.
      - name: Compile public API examples
        run: bash ./scripts/check-examples.sh

      - name: Build DocC documentation
        run: bash ./scripts/build-docs.sh

  # Export one relocatable build. Default test groups and each language reuse these exact products
  # on independent runners, so cold simulator setup does not contend across configurations.
  ui-test-build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SwiftUICalendar
    steps:
      - name: Checkout SwiftUICalendar
        uses: actions/checkout@v7.0.1
        with:
          path: SwiftUICalendar

      - name: Select Swift toolchain
        run: bash ./scripts/select-swift-toolchain.sh

      - name: Build sample UI tests once
        run: >-
          xcodebuild build-for-testing
          -project Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj
          -scheme SwiftUICalendarSample -destination "generic/platform=iOS Simulator"
          -skipMacroValidation -testProductsPath .build/SampleUITests.xctestproducts

      # Preserve executable permissions and symlinks when passing products between runners.
      - name: Archive UI test products
        run: tar -czf .build/SampleUITests.tar.gz -C .build SampleUITests.xctestproducts

      - name: Upload UI test products
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-test-products
          path: SwiftUICalendar/.build/SampleUITests.tar.gz
          compression-level: 0
          retention-days: 1

  ui-test-plans:
    name: UI plan (${{ matrix.name }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: ui-test-build
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dynamic Type
            plan: SwiftUICalendarSample
            configuration: ""
            suites: DynamicTypeUITests
          - name: Layout
            plan: SwiftUICalendarSample
            configuration: ""
            suites: |
              FixedCalendarRotationUITests
              RotationUITests
              RotationScrollUITests
              VerticalLandscapeUITests
              WeekdayColumnsReachableUITests
          - name: Navigation
            plan: SwiftUICalendarSample
            configuration: ""
            suites: |
              HeaderControlUITests
              VerticalScrollDateUpdateReproUITests
          - name: English
            plan: SwiftUICalendarSampleLocales
            configuration: English
          - name: German
            plan: SwiftUICalendarSampleLocales
            configuration: German
          - name: Persian
            plan: SwiftUICalendarSampleLocales
            configuration: Persian
          - name: Arabic
            plan: SwiftUICalendarSampleLocales
            configuration: Arabic
          - name: Hebrew
            plan: SwiftUICalendarSampleLocales
            configuration: Hebrew
    defaults:
      run:
        working-directory: SwiftUICalendar
    env:
      DEVICE_NAME: iPhone 17
      UI_TEST_PLAN: ${{ matrix.plan }}
      UI_TEST_CONFIGURATION: ${{ matrix.configuration }}
      UI_TEST_SUITES: ${{ matrix.suites }}
    steps:
      - name: Checkout SwiftUICalendar
        uses: actions/checkout@v7.0.1
        with:
          path: SwiftUICalendar

      - name: Select Swift toolchain
        run: bash ./scripts/select-swift-toolchain.sh

      - name: Download UI test products
        uses: actions/download-artifact@v8.0.2
        with:
          name: ui-test-products
          path: SwiftUICalendar/.build

      - name: Restore UI test products
        run: tar -xzf .build/SampleUITests.tar.gz -C .build

      - name: Record runner resources
        run: |
          sysctl hw.ncpu hw.memsize
          df -h .

      - name: Create UI test simulator
        run: |
          udid="$(bash ./scripts/ui-test-simulator.sh create "$DEVICE_NAME")"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Prepare UI test simulator
        timeout-minutes: 5
        run: |
          bash ./scripts/ui-test-simulator.sh prepare "$SIMULATOR_UDID"
          xcrun simctl list devices booted
          vm_stat

      - name: Run UI test plan
        timeout-minutes: 20
        # Leave worker scheduling to Xcode; retain the existing individual test limits.
        # Full simulator diagnostics collection hangs here; keep XCTest result bundles instead.
        # The process watchdog exits before GitHub cancels the step, leaving time to upload evidence.
        run: |
          flags=(
            -test-timeouts-enabled YES
            -default-test-execution-time-allowance 180
            -maximum-test-execution-time-allowance 300
            -collect-test-diagnostics never
          )
          ruby ./scripts/test-watchdog.rb --timeout 900 --diagnostics .build/results/watchdog -- \
            bash ./scripts/ui-test-simulator.sh test "$SIMULATOR_UDID" "$UI_TEST_PLAN" \
              .build/results/tests.xcresult "${flags[@]}"

      - name: Delete UI test simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: bash ./scripts/ui-test-simulator.sh delete "$SIMULATOR_UDID"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-test-results-${{ matrix.name }}
          path: SwiftUICalendar/.build/results
          if-no-files-found: ignore

  # Keep the required check's name stable and fail it if any build or matrix job fails or skips.
  ui-tests:
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: [ui-test-build, ui-test-plans]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every UI test plan to pass
        env:
          BUILD_RESULT: ${{ needs.ui-test-build.result }}
          PLANS_RESULT: ${{ needs.ui-test-plans.result }}
        run: test "$BUILD_RESULT" = success && test "$PLANS_RESULT" = success

  main-validation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SwiftUICalendar
    steps:
      - name: Checkout SwiftUICalendar
        uses: actions/checkout@v7.0.1
        with:
          path: SwiftUICalendar

      - name: Select Swift toolchain
        run: bash ./scripts/select-swift-toolchain.sh

      - name: Record toolchain fingerprint
        id: toolchain-fingerprint
        run: echo "value=$(swift --version | tr '\n' ' ')|$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies and build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            SwiftUICalendar/.build
            SwiftUICalendar/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('SwiftUICalendar/Package.swift', 'SwiftUICalendar/Package.resolved', 'SwiftUICalendar/Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ steps.toolchain-fingerprint.outputs.value }}

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Validate Swift formatting
        run: bash ./scripts/lint.sh

      - name: Validate CI scripts
        run: |
          ruby ./scripts/tests/test-watchdog-test.rb
          ruby ./scripts/tests/ui-test-simulator-test.rb
          ruby ./scripts/tests/ui-test-workflow-test.rb

      - name: Build package
        run: swift build -c debug

      # Runs every package test, in parallel, with coverage enabled, then enforces the minimum.
      - name: Run all tests and check coverage
        timeout-minutes: 20
        env:
          MINIMUM_COVERAGE: 80
        run: ruby ./scripts/test-watchdog.rb --timeout 900 -- bash ./scripts/check-coverage.sh

      - name: Upload package test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package-test-diagnostics
          path: SwiftUICalendar/.build/test-diagnostics
          if-no-files-found: ignore

      - name: Build iOS sample
        # Allow the locked TCA dependency macros on fresh, noninteractive CI runners.
        run: >-
          xcodebuild -project Examples/SwiftUICalendarSample/SwiftUICalendarSample.xcodeproj
          -scheme SwiftUICalendarSample -destination "generic/platform=iOS Simulator"
          -skipMacroValidation
          -derivedDataPath .build/SampleRelease CODE_SIGNING_ALLOWED=NO build

      - name: Compile public API examples
        run: bash ./scripts/check-examples.sh

      - name: Build DocC documentation
        run: bash ./scripts/build-docs.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: SwiftUICalendar/.build/docs

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: main-validation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
